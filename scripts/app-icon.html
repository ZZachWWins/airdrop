<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Source for the maskable app icons in /public (apple-touch-icon.png and
      the manifest icons). Rendered square with a solid navy plate, because
      iOS composites home-screen icons onto an opaque background and a
      transparent mark would come out looking broken.

      Regenerate:  node scripts/render-assets.mjs
    -->
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 512px; height: 512px; }
      body {
        background: #010414;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .plate {
        width: 512px;
        height: 512px;
        background:
          radial-gradient(circle at 32% 24%, rgba(0, 25, 165, 0.75) 0%, rgba(1, 4, 20, 0) 68%),
          #010414;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* ~62% of the canvas keeps the mark inside the safe area once iOS and
         Android apply their own rounded masks. */
      svg { width: 318px; height: 318px; }
    </style>
  </head>
  <body>
    <div class="plate">
      <svg viewBox="0 0 768 768" fill="none">
        <g stroke="#F0F2F5" stroke-width="52" stroke-linecap="round">
          <path d="M384 40v150" /><path d="M384 578v150" />
          <path d="M40 384h150" /><path d="M578 384h150" />
          <path d="M192 120l384 528" /><path d="M576 120L192 648" />
        </g>
      </svg>
    </div>
  </body>
</html>
